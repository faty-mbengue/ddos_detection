# Configuration nginx utilisee avec docker-compose.capture.yml (network_mode host) :
# le backend n'est plus joignable par son nom de service, on relaie vers 127.0.0.1.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # L'analyse de fichier accepte jusqu'a 200 Mo cote backend. Sans cette

    # directive, nginx rejette des 1 Mo (defaut) avec un 413 et la requete

    # n'atteint jamais l'API.

    client_max_body_size 200M;


    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://127.0.0.1:8000$request_uri;
        proxy_set_header Host $host;
    }
}
